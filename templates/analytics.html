{% extends "base.html" %}

{% block title %}Analytics - Smart Attendance{% endblock %}

{% block content %}
<div class="glass-panel mb-4">
    <h2 class="mb-4">System Analytics</h2>

    <div class="dashboard-stats mb-4">
        <div class="glass-panel stat-card">
            <h3>Total Students</h3>
            <div class="number">{{ total_students }}</div>
        </div>
        <div class="glass-panel stat-card">
            <h3>Total Records</h3>
            <div class="number" style="color: var(--primary-color);">{{ total_records }}</div>
        </div>
        <div class="glass-panel stat-card">
            <h3>Present Today</h3>
            <div class="number" style="color: var(--success-color);">{{ today_present }}</div>
        </div>
    </div>

    <!-- Charts Section -->
    <div style="margin-bottom: 2rem;">
        <div class="glass-panel">
            <h3 class="mb-3">Subject Attendance Distribution</h3>
            <canvas id="subjectChart"></canvas>
        </div>
    </div>

</div>

<!-- Chart.js Integration -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Theme colors matching the glassmorphism UI
    Chart.defaults.color = 'rgba(255, 255, 255, 0.7)';
    const primaryColor = 'rgba(59, 130, 246, 0.8)';
    const primaryBorder = 'rgba(59, 130, 246, 1)';
    const successColor = 'rgba(16, 185, 129, 0.8)';
    const successBorder = 'rgba(16, 185, 129, 1)';

    // Subject Chart (Bar)
    const ctxSubject = document.getElementById('subjectChart').getContext('2d');
    new Chart(ctxSubject, {
        type: 'bar',
        data: {
            labels: {{ subjects | tojson | safe }},
            datasets: [{
                label: 'Total Attendance Records',
                data: {{ sub_counts | tojson | safe }},
                backgroundColor: primaryColor,
                borderColor: primaryBorder,
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
                x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });
</script>
{% endblock %}
